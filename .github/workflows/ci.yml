name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip when Cloudflare is not configured
        id: configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.configured.outputs.ok == 'true'
        uses: actions/checkout@v7
      - if: steps.configured.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.configured.outputs.ok == 'true'
        run: npm ci
      - name: Deploy
        if: steps.configured.outputs.ok == 'true'
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          LAKE_API_TOKEN: ${{ secrets.LAKE_API_TOKEN }}
        run: |
          # Only secrets that are set are uploaded; the others keep their current value.
          node -e '
            const names = ["OAUTH_CLIENT_ID", "OAUTH_CLIENT_SECRET", "LAKE_API_TOKEN"];
            const secrets = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync(process.argv[1], JSON.stringify(secrets));
          ' "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
          rm "$RUNNER_TEMP/secrets.json"
